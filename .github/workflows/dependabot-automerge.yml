# Auto-merges Dependabot PRs for patch and minor updates once every other
# check on the PR (CI, Vercel preview, etc.) has passed. Major updates, GitHub
# Actions updates, and any PR whose checks fail or never report are left open
# and assigned for review.
#
# Managed by the Rade maintenance kit — edit the kit template, not this copy.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # Required: `gh pr checks` always selects checkSuite{workflowRun{...}} on the
  # PR's commit, whatever fields --json asks for. Without actions: read that
  # GraphQL query is rejected and the step below can read no checks at all.
  actions: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: echo "Major update ($DEPS) - leaving for manual review."

      # GitHub Actions updates edit files under .github/workflows/. The built-in
      # GITHUB_TOKEN can never be granted the `workflows` permission, so GitHub
      # rejects its merge of such a PR. Say so on the PR instead of failing.
      - name: Leave GitHub Actions updates for review
        if: >-
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Not auto-merged: this updates workflow files under \`.github/workflows/\`, which the built-in Actions token is not permitted to change. Merge it yourself once checks pass." || true

      - name: Wait for checks, then merge
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.workflow }}
        run: |
          set -uo pipefail
          note() { gh pr comment "$PR_URL" --body "$1" >/dev/null || true; echo "$1"; }

          # Give CI and Vercel time to register their checks.
          sleep 60
          deadline=$((SECONDS + 2700))
          stable=0
          errors=0
          err=$(mktemp)
          while :; do
            # `gh pr checks` exits non-zero when checks are merely pending or
            # failing, so the exit code alone cannot tell us the call worked.
            # Trust stdout instead: valid JSON means we got a real answer.
            json=$(gh pr checks "$PR_URL" --json name,bucket,workflow 2>"$err") || true
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$json"; then
              if grep -qi 'no checks reported' "$err"; then
                # A genuine empty state: no check has registered on the PR yet.
                json='[]'
              else
                errors=$((errors + 1))
                echo "gh pr checks failed to return JSON (attempt $errors):" >&2
                cat "$err" >&2
                if [ "$errors" -ge 5 ]; then
                  note "Auto-merge aborted: could not read this PR's checks (see the workflow log). Leaving this PR for review."
                  exit 1
                fi
                stable=0
                sleep 45
                continue
              fi
            fi
            errors=0
            others=$(jq -c --arg s "$SELF" '[.[] | select(.workflow != $s)]' <<<"$json")
            total=$(jq 'length' <<<"$others")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$others")
            failed=$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<<"$others")

            if [ -n "$failed" ]; then
              note "Auto-merge skipped: these checks did not pass: $failed. Leaving this PR for review."
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              # Require two consecutive all-green reads so a late-registering
              # check (e.g. Vercel) is not missed.
              stable=$((stable + 1))
              [ "$stable" -ge 2 ] && break
            else
              stable=0
            fi
            if [ "$SECONDS" -gt "$deadline" ]; then
              if [ "$total" -eq 0 ]; then
                note "Auto-merge skipped: no CI or Vercel checks reported on this PR, so there was nothing to verify it against."
              else
                note "Auto-merge skipped: checks were still pending after 45 minutes."
              fi
              exit 0
            fi
            sleep 45
          done

          method=$(gh repo view --json squashMergeAllowed,mergeCommitAllowed \
            -q 'if .squashMergeAllowed then "--squash" elif .mergeCommitAllowed then "--merge" else "--rebase" end')
          gh pr merge "$PR_URL" $method --delete-branch --match-head-commit "$HEAD_SHA" \
            || note "Auto-merge attempted but the merge failed (branch may have changed or conflicts exist)."
