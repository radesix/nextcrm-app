name: Upstream drift watch

# Weekly (and on-demand) check of how far this fork is behind pdovhomilja/nextcrm-app.
# When behind, it writes a report to the run's job summary and fails the run, so the
# scheduled failure email is the weekly reminder to sync. It NEVER merges anything
# itself — merges belong on a workstation where conflicts can be resolved, then
# validated by CI + Guardrails (scripts/sync-upstream.sh).
#
# Why a job summary and a red run, not a tracking issue: this repo is a *fork*, and
# GitHub withholds issue-write from the automatic GITHUB_TOKEN on forks (createIssue
# returns "Resource not accessible by integration" even with `issues: write` granted
# and the repo default set to read-write). Filing an issue would require a PAT secret.
# The summary + non-zero exit needs only `contents: read` and no secret. See
# docs/reference/LESSONS_LEARNED.md.
#
# Note: scheduled runs only fire from the default branch once this file is on main.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare with upstream/main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_URL: https://github.com/pdovhomilja/nextcrm-app.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure drift and report
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --quiet upstream main

          behind=$(git rev-list --count HEAD..upstream/main)
          echo "This fork is behind upstream/main by $behind commit(s)."

          {
            echo "## Upstream drift"
            echo
            echo "This fork is **${behind} commit(s)** behind \`upstream/main\` (pdovhomilja/nextcrm-app)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$behind" -eq 0 ]; then
            echo "Up to date — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          commits="$(git log --oneline --no-merges HEAD..upstream/main | head -50)"
          {
            echo
            echo "Merge it through the tested lane (never straight into \`main\`):"
            echo
            echo '```bash'
            echo 'bash scripts/sync-upstream.sh'
            echo '```'
            echo
            echo "That creates a \`sync/upstream-<date>\` branch and (with \`--push\`) opens a PR, so"
            echo "**CI + Guardrails validate the merge before it reaches \`main\`.** Guardrails will"
            echo "catch schema/migration drift and any reverted fork invariant."
            echo
            echo "<details><summary>Incoming commits (up to 50)</summary>"
            echo
            echo '```'
            echo "$commits"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotate and fail, so the scheduled run goes red and GitHub emails the
          # weekly reminder. The annotation text makes clear this is drift, not a
          # workflow malfunction.
          echo "::error title=Upstream drift::Fork is ${behind} commit(s) behind upstream/main — run scripts/sync-upstream.sh to sync through the tested lane."
          exit 1
