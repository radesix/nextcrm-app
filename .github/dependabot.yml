# Dependency updates, consolidated so long CI/deploy pipelines see few PRs:
#   - npm patch + minor  → ONE weekly PR, auto-merged once CI and the Vercel
#                          preview pass (workflows/dependabot-automerge.yml)
#   - npm majors         → ONE separate PR, always left for review (they often
#                          need code changes and would block the weekly bundle)
#   - security updates   → bundled into ONE PR per run (needs "Dependabot
#                          security updates" on in Settings → Code security)
#   - GitHub Actions     → ONE PR a month, left for review
# PRs are assigned to @radesix so they show in the GitHub mobile "Assigned"
# filter. Shipped by the starter kit (docs/guides/process/CI_AND_ENVIRONMENT_DESIGN.md §7a).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    # Skip releases younger than a few days: compromised npm versions are
    # usually caught and pulled within that window.
    cooldown:
      default-days: 3
    # Safety cap: a backlog can never arrive as a flood of PRs.
    open-pull-requests-limit: 2
    assignees: ["radesix"]
    labels: ["dependencies", "automated"]
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    assignees: ["radesix"]
    labels: ["dependencies", "automated"]
    groups:
      actions:
        patterns: ["*"]
